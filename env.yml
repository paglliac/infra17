---
# Set one key in a service's .env and restart it; the value is asked for and never echoed.
#   make env S=budget K=ZENMONEY_TOKEN
- name: Set a key in .env
  hosts: vds
  become: true
  gather_facts: false
  vars_prompt:
    - name: env_value
      prompt: "{{ key | default('?') }}"
      private: true
  tasks:
    - name: Check the arguments
      ansible.builtin.assert:
        that:
          - only in services
          - key is defined and key is match('^[A-Z0-9_]+$')
          - env_value | length > 0
        fail_msg: "Usage: make env S=<service> K=<KEY>"
        quiet: true

    - name: Write the key
      ansible.builtin.lineinfile:
        path: "{{ srv_root }}/{{ only }}/.env"
        regexp: "^{{ key }}="
        line: "{{ key }}={{ env_value }}"
        owner: "{{ only }}"
        group: "{{ only }}"
        mode: "0600"
      no_log: true
      register: env_written

    - name: Restart the service
      ansible.builtin.systemd_service:
        name: "{{ only }}"
        state: restarted
      when: env_written.changed
