---
# Every service's `direct` hosts plus `direct_taken` (services.yml); the rules are host-wide, so a run for one
# service keeps them all.
direct_hosts: "{{ (services.values() | map(attribute='direct', default=[]) | flatten
  + direct_taken | default({}) | dict2items | map(attribute='value') | flatten) | unique }}"
# Before awg-quick's rules (100 and up), so these addresses never reach table 51820.
direct_priority: 90
