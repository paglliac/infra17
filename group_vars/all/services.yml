---
# Every service on the host. Adding one: an entry here, a free port, `make deploy`.
#
#   repo        GitHub repo; the server reads it with its own read-only deploy key
#   version     branch or tag to check out (default main)
#   port        127.0.0.1 port the service listens on; must not clash with another one or with ports_taken
#   subdomain   <subdomain>.<base_domain> goes to the port through Caddy with HTTPS
#   runtime     node | python — installed once per host
#   exec        command line, run from the checkout; PORT, HOST and TZ are in its environment
#   requirements  python only: requirements file in the repo, installed into /srv/<name>/venv
#   build       shell command run in the checkout after the dependencies, as the service user with Node on
#               PATH (e.g. a frontend build); runs again whenever a new commit is checked out
#   environment {KEY: value} for the unit, not secret (secrets go to .env)
#   claude      true: the service runs Claude Code CLI (/usr/bin/claude from Anthropic's apt package)
#   direct      hosts the service reaches from the host's own address instead of through awg0 (sites that refuse
#               the NL address); the direct role keeps the rules, `make direct` applies them alone
#   data_link   path in the checkout that should point at /srv/<name>/data (for apps that keep data next to code)
#   secrets     {KEY: length} generated into .env on the first run and never changed after
#   env_from    local .env file on the control machine; env_keys are taken from it on the first run
#   env_keys    see env_from
#   sqlite      databases `make data` brings over from the control machine
#   health      {path, status} checked after every run
#
# Layout on the host: /srv/<name>/app (checkout), /srv/<name>/data, /srv/<name>/.env, unit <name>.service.

# Ports in use by things deployed elsewhere.
ports_taken:
  secondbrain: 3141   # SecondBrain's own deploy/ (repo paglliac/tasks17), on base_domain itself

# `direct` hosts of things deployed elsewhere (see `direct` above); the direct role owns every such rule on the host.
direct_taken:
  # ktalk transcripts and the Exchange calendar: both time out from the NL address since 2026-11; SecondBrain's
  # Claude needs that address, so only these hosts
  secondbrain: [avito.ktalk.ru, exchange.avito.ru]

services:
  budget:
    repo: git@github.com:paglliac/budget17.git
    port: 4317
    subdomain: budget
    runtime: node
    exec: "{{ node_dir }}/bin/node src/web/server.ts"
    data_link: data
    secrets:
      ACCESS_TOKEN: 40
    env_from: "{{ budget_env_file | default('') }}"
    env_keys: [ZENMONEY_TOKEN]
    direct: [api.zenmoney.ru]   # refuses the NL address since 2026-10-30; its Claude needs that address, so only this host
    sqlite: [settings.db, zenmoney.db]
    health: {path: /api/session, status: 401}

  recaps:
    repo: git@github.com:paglliac/mm-recaps.git
    port: 4325
    subdomain: recaps
    runtime: python
    claude: true
    exec: "{{ srv_root }}/recaps/venv/bin/python -m recaps"
    requirements: requirements.txt
    data_link: data
    secrets:
      RECAPS_ACCESS_TOKEN: 40
    env_from: "{{ recaps_env_file | default('') }}"
    env_keys: [MM_TOKEN]
    sqlite: [recaps.db]
    health: {path: /healthz, status: 200}

  go:
    repo: git@github.com:paglliac/go-game.git
    port: 4318
    subdomain: go
    runtime: python
    requirements: backend/requirements.txt
    build: cd frontend && npm ci --no-audit --no-fund && npm run build
    exec: "{{ srv_root }}/go/venv/bin/uvicorn app.main:create_app --factory --app-dir backend --host 127.0.0.1 --port 4318"
    data_link: backend/data
    claude: true
    environment:
      CLAUDE_BIN: /usr/bin/claude
      CLAUDE_CONFIG_DIR: /srv/go/data/claude   # its own, writable; no one is logged in there
      DISABLE_AUTOUPDATER: "1"
    # The owner's `claude setup-token` and the owner's player name: make env S=go K=…
    env_keys: [CLAUDE_CODE_OAUTH_TOKEN, GO_OWNER]
    health: {path: /api/health, status: 200}

  motor:
    repo: git@github.com:paglliac/engine17.git
    port: 4319
    subdomain: motor
    runtime: python
    exec: "{{ srv_root }}/motor/venv/bin/python -m motor"
    requirements: requirements.txt
    data_link: data            # motor.db: consumers, provider tokens, provider state
    secrets:
      MOTOR_SESSION_SECRET: 40
    # The page password: `make hash-password` in engine17, then make env S=motor K=MOTOR_PASSWORD_HASH.
    # Until then the page says so; providers already answer to consumer tokens.
    # The Exchange calendar (task П2) times out from the NL address. Also in direct_taken of SecondBrain until
    # the hub reads the calendar through the motor (task Х8).
    direct: [exchange.avito.ru]
    health: {path: /healthz, status: 200}

  assistant:
    repo: git@github.com:paglliac/assistant17.git
    port: 4330
    subdomain: assistant
    runtime: python
    requirements: service/requirements.txt
    exec: "{{ srv_root }}/assistant/venv/bin/uvicorn assistant.app:create_app --factory --app-dir service --host 127.0.0.1 --port 4330"
    # The phone app's key; the app reads it from ~/.config/assistant-proto/assistant.env at build time.
    secrets:
      ASSISTANT_TOKEN: 40
    health: {path: /healthz, status: 200}

  tv:
    repo: git@github.com:paglliac/tv17.git
    port: 4331
    subdomain: tv
    runtime: python
    requirements: server/requirements.txt
    exec: "{{ srv_root }}/tv/venv/bin/uvicorn tv.app:create_app --factory --app-dir server --host 127.0.0.1 --port 4331"
    # The TV app's key; the APK takes it from android/local.properties (tv.token) at build time.
    # YouTube search is yt-dlp: when it breaks, bump yt-dlp in server/requirements.txt and `make app S=tv`.
    secrets:
      TV_TOKEN: 40
    # «Что посмотреть?» asks Claude; the family's ratings live in data/taste.db. The server finds the CLI on
    # PATH and keeps its state in data/claude by itself, so `make app` is enough even before a full deploy.
    claude: true
    data_link: data
    environment:
      CLAUDE_BIN: /usr/bin/claude
      CLAUDE_CONFIG_DIR: /srv/tv/data/claude   # its own, writable; no one is logged in there
      DISABLE_AUTOUPDATER: "1"
    # The owner's `claude setup-token` (the same one recaps uses): make env S=tv K=CLAUDE_CODE_OAUTH_TOKEN
    env_keys: [CLAUDE_CODE_OAUTH_TOKEN]
    health: {path: /healthz, status: 200}
